tts:
  name: Speak (legacy)
  description: >
    Speak text on all configured Karotz devices. Prefer the tts entity
    (tts.<device>) added in v4; this service is kept for automation
    compatibility with v3.
  fields:
    text:
      name: Text
      description: The text to speak.
      required: true
      example: "Hello, this is Karotz speaking."
      selector:
        text:
    voice:
      name: Voice
      description: >
        Voice id as reported by the device voice_list (numeric on current
        firmware, e.g. 6 = English (US) Female). Defaults to the device default.
      required: false
      example: "6"
      selector:
        text:
